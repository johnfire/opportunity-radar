name: radar-ci

on:
  push:
    paths: ["radar/**", ".github/workflows/radar-ci.yml"]
  pull_request:
    paths: ["radar/**"]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: radar/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check (strict)
        run: mypy src tests
      - name: Tests (unit, integration, end to end, code standards)
        run: pytest -q
      - name: Dependency audit
        run: pip-audit
